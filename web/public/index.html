<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFCF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100F0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>sift</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<aside id="drawer" class="drawer" aria-label="Queue and library">
  <form id="add-form" class="add" autocomplete="off">
    <input id="add-url" type="url" inputmode="url" placeholder="Paste a link to add" aria-label="Link to add" required>
    <button id="add-button" type="submit" aria-label="Add to queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </form>
  <p id="add-error" class="add-error" role="alert" hidden></p>
  <div class="drawer-scroll">
    <section class="group">
      <button class="group-head" type="button" aria-expanded="true" aria-controls="queue-body" data-group="queue">
        <span class="group-title">Queue</span><span class="group-count" id="queue-count"></span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="group-body" id="queue-body">
        <ul id="queue-list" class="rows"></ul>
        <p id="queue-empty" class="hint" hidden>The queue is empty. Paste a link above, or add something from the library.</p>
      </div>
    </section>
    <section class="group">
      <button class="group-head" type="button" aria-expanded="false" aria-controls="library-body" data-group="library">
        <span class="group-title">Library</span><span class="group-count" id="library-count"></span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="group-body" id="library-body" hidden>
        <input id="filter" class="filter" type="search" placeholder="Filter" aria-label="Filter the library">
        <ul id="library-list" class="rows"></ul>
      </div>
    </section>
  </div>
</aside>
<div id="scrim" class="scrim"></div>

<main id="reader" class="reader">
  <div id="empty" class="empty">
    <p>Nothing open.</p>
    <p class="hint">Pick an article from the queue.</p>
  </div>
  <article id="article" class="article" hidden>
    <header class="article-header">
      <h1 id="title"></h1>
      <p id="meta" class="meta"></p>
    </header>
    <div id="content" class="content"></div>
  </article>
</main>

<button id="resume" class="resume" type="button" hidden>Back to playback</button>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<footer class="player">
  <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>
  <div class="player-row">
    <button id="queue-button" class="icon-button" type="button" aria-label="Queue" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <div class="transport">
      <button id="prev" class="icon-button" type="button" aria-label="Previous sentence">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M18 6.5v11a1 1 0 0 1-1.5.86l-8-5.5a1 1 0 0 1 0-1.72l8-5.5A1 1 0 0 1 18 6.5Z"/><path d="M6 6v12"/></svg>
      </button>
      <button id="play" class="play" type="button" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
        <span class="buffer" aria-hidden="true"></span>
      </button>
      <button id="next" class="icon-button" type="button" aria-label="Next sentence">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M6 6.5v11a1 1 0 0 0 1.5.86l8-5.5a1 1 0 0 0 0-1.72l-8-5.5A1 1 0 0 0 6 6.5Z"/><path d="M18 6v12"/></svg>
      </button>
    </div>
    <button id="options-button" class="icon-button options-button" type="button" aria-label="Speed, voice, and text size" aria-expanded="false" aria-controls="sheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span id="speed-badge" class="speed-badge" aria-hidden="true" hidden></span>
    </button>
  </div>
</footer>

<div id="sheet" class="sheet" role="dialog" aria-label="Playback options" hidden>
  <div id="sheet-main" class="sheet-page">
    <div class="sheet-row">
      <span>Speed</span>
      <div class="stepper">
        <button id="slower" type="button" aria-label="Slower"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <output id="speed-value">1.00×</output>
        <button id="faster" type="button" aria-label="Faster"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <button id="voice-row" class="sheet-row sheet-nav" type="button" aria-controls="voice-page">
      <span>Voice</span>
      <span class="sheet-value"><span id="voice-value"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span>
    </button>
    <div class="sheet-row">
      <span>Text size</span>
      <div class="stepper">
        <button id="smaller" type="button" aria-label="Smaller text"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <output id="size-value">19</output>
        <button id="larger" type="button" aria-label="Larger text"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <a id="source" class="sheet-link" target="_blank" rel="noopener noreferrer" hidden>Open the original page</a>
  </div>
  <div id="voice-page" class="sheet-page voice-page" hidden>
    <div class="voice-head">
      <button id="voice-back" class="icon-button" type="button" aria-label="Back to options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <span class="voice-title">Voice</span>
    </div>
    <input id="voice-search" class="filter voice-search" type="search" placeholder="Search voices" aria-label="Search voices" autocomplete="off">
    <div id="voice-status" class="voice-status" hidden>
      <span>The voice server is not answering.</span>
      <button id="voice-retry" type="button">Retry</button>
    </div>
    <div id="voice-list" class="voice-list" aria-label="Voices"></div>
  </div>
</div>

<template id="icon-grip"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg></template>
<template id="icon-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></template>
<template id="icon-plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></template>
<template id="icon-play-small"><svg viewBox="0 0 24 24"><path class="fill" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg></template>
<template id="icon-stop"><svg viewBox="0 0 24 24"><rect class="fill" x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg></template>
<template id="icon-check"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></template>
</body>
</html>
