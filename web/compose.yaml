services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8777:8080"
    volumes:
      - ./data:/data
    environment:
      KOKORO_URL: http://kokoro:8880
      SIFT_HOSTS: ${SIFT_HOSTS:-localhost,127.0.0.1}
    depends_on:
      - kokoro
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped
